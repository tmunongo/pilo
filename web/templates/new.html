{{define "title"}}Pilo · New Project{{end}}

{{define "content"}}
<h1 class="text-2xl font-semibold text-neutral-50 mb-6">Deploy a new project</h1>

{{if .Error}}
  <div class="border border-red-900 bg-red-950/50 text-red-300 rounded-md px-4 py-3 mb-6 text-sm">{{.Error}}</div>
{{end}}

<form method="post" action="/projects" class="space-y-5 max-w-lg">
  <div>
    <label class="block text-sm text-neutral-400 mb-1">GitHub repo</label>
    <input name="repo" required placeholder="owner/repo or full github.com URL"
      value="{{.Form.repo}}"
      class="w-full bg-neutral-900 border border-neutral-800 rounded-md px-3 py-2 text-neutral-100 placeholder-neutral-600 focus:outline-none focus:border-emerald-600">
    <p class="text-xs text-neutral-600 mt-1">e.g. <code>tawanda/left-bank-cafe-menu</code></p>
  </div>

  <div>
    <label class="block text-sm text-neutral-400 mb-1">Slug (URL path)</label>
    <input name="slug" placeholder="auto-filled from repo name" value="{{.Form.slug}}"
      class="w-full bg-neutral-900 border border-neutral-800 rounded-md px-3 py-2 text-neutral-100 placeholder-neutral-600 focus:outline-none focus:border-emerald-600">
    <p class="text-xs text-neutral-600 mt-1">Will be served at <code>/&lt;slug&gt;/</code></p>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="block text-sm text-neutral-400 mb-1">Branch</label>
      <input name="branch" value="{{if .Form.branch}}{{.Form.branch}}{{else}}main{{end}}"
        class="w-full bg-neutral-900 border border-neutral-800 rounded-md px-3 py-2 text-neutral-100 focus:outline-none focus:border-emerald-600">
    </div>
    <div>
      <label class="block text-sm text-neutral-400 mb-1">Subdirectory <span class="text-neutral-600">(optional)</span></label>
      <input name="subdir" placeholder="e.g. tools/my-app" value="{{.Form.subdir}}"
        class="w-full bg-neutral-900 border border-neutral-800 rounded-md px-3 py-2 text-neutral-100 placeholder-neutral-600 focus:outline-none focus:border-emerald-600">
    </div>
  </div>

  <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-md">
    Clone &amp; Deploy
  </button>
</form>
{{end}}
