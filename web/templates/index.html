{{define "title"}}Pilo · Projects{{end}}

{{define "content"}}
<h1 class="text-2xl font-semibold text-neutral-50 mb-6">Projects</h1>

{{if not .Projects}}
  <div class="border border-dashed border-neutral-800 rounded-lg p-10 text-center text-neutral-500">
    No projects yet. <a href="/projects/new" class="text-emerald-500 hover:underline">Deploy your first tool</a>.
  </div>
{{else}}
  <div class="grid gap-3" id="project-list">
    {{range .Projects}}
      {{template "project_row" .}}
    {{end}}
  </div>
{{end}}
{{end}}
