{{define "base"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Pilo{{end}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-neutral-950 text-neutral-200 min-h-screen">
  <nav class="border-b border-neutral-800 px-6 py-4 flex items-center justify-between">
    <a href="/" class="font-semibold text-lg text-neutral-50">🛰️ Pilo</a>
    <div class="flex gap-4 text-sm">
      <a href="/" class="text-neutral-400 hover:text-neutral-100">Projects</a>
      <a href="/settings" class="text-neutral-400 hover:text-neutral-100">Settings</a>
      <a href="/projects/new" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-md">+ New Project</a>
    </div>
  </nav>
  <main class="max-w-4xl mx-auto px-6 py-10">
    {{block "content" .}}{{end}}
  </main>
</body>
</html>
{{end}}
