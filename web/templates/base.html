{{define "base"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}pilo{{end}}</title>

  <!--
    Fonts: IBM Plex Mono (machine text) + Hanken Grotesk (human text)
    Brief calls for self-hosting woff2 on production; Google Fonts used here
    for development. Swap for self-hosted @font-face rules before shipping to
    a machine that may be offline.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/htmx.org@1.9.12"></script>

  <style>
    /* ── Color tokens ─────────────────────────────────────────────────── */
    :root {
      --ground:   #FFFFFF;
      --ink:      #111111;
      --muted:    #5F5F5F;
      --hairline: #E2E2E2;
      --wash:     #F3F3F3;
      --lamp:     #C8730A;
    }

    /* ── Reset / base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 400;
      color: var(--ink);
      background: var(--ground);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── Focus ────────────────────────────────────────────────────────── */
    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    /* ── Typography ───────────────────────────────────────────────────── */
    .font-mono { font-family: 'IBM Plex Mono', monospace; }

    h1.page-title {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 46px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--ink);
    }

    h1.project-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
      color: var(--ink);
    }

    h2.section-heading {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 500;
      color: var(--ink);
    }

    p.page-lead {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 19px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.45;
    }

    p.section-prose {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.45;
    }

    /* ── Layout shell ─────────────────────────────────────────────────── */
    .shell {
      max-width: 820px;
      margin-inline: auto;
      padding-inline: 24px;
      width: 100%;
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--hairline);
    }

    header .shell {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    /* Wordmark */
    .wordmark {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.01em;
      flex-shrink: 0;
    }

    .wordmark:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    /* Lamp dot on wordmark — the pilot light */
    .lamp-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--lamp);
      flex-shrink: 0;
    }

    .lamp-dot--breathing {
      animation: lamp-breathe 2.4s ease-in-out infinite;
    }

    @keyframes lamp-breathe {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    @media (prefers-reduced-motion: reduce) {
      .lamp-dot--breathing { animation: none; }
    }

    /* Nav */
    header nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-link {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 400;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-link:hover {
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    .nav-link--active {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 6px;
    }

    /* Primary button */
    .btn-primary {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      font-weight: 400;
      color: var(--ground);
      background: var(--ink);
      border: 1px solid var(--ink);
      border-radius: 2px;
      padding: 8px 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      white-space: nowrap;
    }

    .btn-primary:hover {
      opacity: 0.85;
    }

    .btn-primary:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    /* ── Main ─────────────────────────────────────────────────────────── */
    main {
      flex: 1;
    }

    main.list-screen  { padding-top: 56px; padding-bottom: 48px; }
    main.detail-screen { padding-top: 40px; padding-bottom: 48px; }

    /* ── Footer ───────────────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--hairline);
      padding-block: 20px;
    }

    footer p {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--muted);
    }

    /* ── Section gaps ─────────────────────────────────────────────────── */
    .section-gap { margin-top: 52px; }

    /* ── Tables ───────────────────────────────────────────────────────── */
    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'IBM Plex Mono', monospace;
    }

    thead th {
      font-size: 12.5px;
      font-weight: 400;
      color: var(--muted);
      text-align: left;
      padding: 14px 8px;
      border-bottom: 1px solid var(--ink);
      white-space: nowrap;
    }

    tbody td {
      font-size: 13.5px;
      font-weight: 400;
      color: var(--ink);
      padding: 14px 8px;
      border-bottom: 1px solid var(--hairline);
      vertical-align: middle;
    }

    tbody tr:hover td {
      background: rgba(17, 17, 17, 0.04);
    }

    tbody tr a {
      text-decoration: none;
      color: inherit;
    }

    /* Fixed table columns keep headers and rows aligned as names wrap. */
    .projects-table {
      min-width: 640px;
      width: 100%;
      table-layout: fixed;
    }

    .projects-table col:nth-child(1) { width: 30%; }
    .projects-table col:nth-child(2) { width: auto; }
    .projects-table col:nth-child(3) { width: 76px; }
    .projects-table col:nth-child(4) { width: 140px; }
    .projects-table td { overflow-wrap: anywhere; }

    .pagination {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
    }

    /* Domain cell: slightly larger */
    .cell-domain {
      font-size: 14.5px;
      font-weight: 500;
    }

    /* Deploys table: native table layout keeps every row aligned. */
    .deploys-table {
      min-width: 580px;
      table-layout: fixed;
    }

    .deploys-table col:nth-child(1) { width: 90px; }
    .deploys-table col:nth-child(3) { width: 200px; }
    .deploys-table col:nth-child(4) { width: 100px; }

    .deploys-table td:nth-child(2) {
      overflow-wrap: anywhere;
    }

    .deploys-table td:nth-child(3) {
      white-space: nowrap;
    }

    .deploys-table .deploy-action {
      text-align: right;
    }

    .deploy-action .btn-text {
      font-size: 13.5px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Webhook logs table */
    .webhook-logs-table {
      min-width: 580px;
      width: 100%;
    }

    .webhook-logs-table thead tr,
    .webhook-logs-table tbody tr {
      display: grid;
      grid-template-columns: 70px 80px 1fr 110px;
      column-gap: 16px;
      align-items: center;
    }

    .webhook-logs-table th,
    .webhook-logs-table td {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Status cell ──────────────────────────────────────────────────── */
    .status-cell {
      display: flex;
      align-items: center;
      gap: 9px;
      white-space: nowrap;
    }

    /* Lamp marks */
    .lamp-mark {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .lamp-mark--solid {
      background: var(--lamp);
    }

    .lamp-mark--building {
      background: var(--lamp);
      animation: lamp-breathe 2.4s ease-in-out infinite;
    }

    .lamp-mark--idle {
      background: transparent;
      border: 1.5px solid var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .lamp-mark--building { animation: none; }
    }

    /* Failed state uses × in ink, no mark */
    .status-failed {
      color: var(--ink);
      font-weight: 500;
    }

    /* ── Webhook box ──────────────────────────────────────────────────── */
    .webhook-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border: 1px solid var(--ink);
      padding: 10px 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      overflow: hidden;
    }

    .webhook-box code {
      font-family: inherit;
      font-size: inherit;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .webhook-box .btn-text {
      flex-shrink: 0;
    }

    /* ── Text action / btn-text ───────────────────────────────────────── */
    .btn-text {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      font-weight: 400;
      color: var(--ink);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 5px;
      padding: 0;
    }

    .btn-text--muted {
      color: var(--muted);
    }

    .btn-text:hover {
      text-decoration-thickness: 2px;
    }

    .btn-text:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    /* ── Key-value list ───────────────────────────────────────────────── */
    .kv-section {
      border-top: 1px solid var(--ink);
    }

    dl.kv-list {
      display: grid;
      grid-template-columns: 110px 1fr;
    }

    dl.kv-list dt,
    dl.kv-list dd {
      padding: 14px 8px;
      border-bottom: 1px solid var(--hairline);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13.5px;
    }

    dl.kv-list dt {
      color: var(--muted);
      font-weight: 400;
    }

    dl.kv-list dd {
      color: var(--ink);
      font-weight: 400;
    }

    @media (max-width: 540px) {
      dl.kv-list {
        grid-template-columns: 1fr;
      }
      dl.kv-list dt {
        padding-bottom: 2px;
        border-bottom: none;
      }
      dl.kv-list dd {
        padding-top: 2px;
      }
    }

    /* ── Log block ────────────────────────────────────────────────────── */
    .log-block {
      background: var(--wash);
      border-radius: 2px;
      padding: 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.7;
      color: var(--ink);
      overflow-x: auto;
      white-space: pre;
    }

    /* ── Action row ───────────────────────────────────────────────────── */
    .action-row {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* ── Back link ────────────────────────────────────────────────────── */
    .back-link {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13.5px;
      color: var(--muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 24px;
    }

    .back-link:hover {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    /* ── Status line (project page) ───────────────────────────────────── */
    .status-line {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13.5px;
      color: var(--muted);
      margin-top: 12px;
    }

    /* ── Form elements ────────────────────────────────────────────────── */
    .form-group { margin-bottom: 20px; }

    .form-group label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .form-input {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13.5px;
      color: var(--ink);
      background: var(--ground);
      border: 1px solid var(--hairline);
      border-radius: 2px;
      padding: 10px 12px;
      width: 100%;
      outline: none;
      transition: border-color 0.1s;
    }

    .form-input:hover  { border-color: var(--muted); }
    .form-input:focus  { border-color: var(--ink); }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 540px) {
      .form-row { grid-template-columns: 1fr; }
    }

    /* ── Error / notice ───────────────────────────────────────────────── */
    .notice {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13.5px;
      color: var(--ink);
      padding: 12px 14px;
      border: 1px solid var(--hairline);
      background: var(--wash);
      margin-bottom: 24px;
    }

    .notice--error {
      border-color: var(--ink);
    }

    .notice--warn {
      border-color: #c8a000;
      background: #fffbea;
      color: #5a4500;
    }

    /* ── Numbered steps (empty state) ─────────────────────────────────── */
    ol.steps {
      list-style: none;
      counter-reset: step;
      margin-top: 32px;
    }

    ol.steps li {
      counter-increment: step;
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 12px;
      padding-block: 16px;
      border-top: 1px solid var(--hairline);
    }

    ol.steps li:last-child {
      border-bottom: 1px solid var(--hairline);
    }

    ol.steps li::before {
      content: counter(step);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13.5px;
      color: var(--muted);
      padding-top: 1px;
    }

    ol.steps li p {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 17px;
      color: var(--ink);
      line-height: 1.45;
    }

    ol.steps li p.step-note {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
    }

    /* ── Live data highlight (htmx swap) ──────────────────────────────── */
    .data-updated {
      animation: highlight-fade 1.5s ease-out forwards;
    }

    @keyframes highlight-fade {
      0%   { background: rgba(17,17,17,0.06); }
      100% { background: transparent; }
    }

    @media (prefers-reduced-motion: reduce) {
      .data-updated { animation: none; }
    }

    /* ── Responsive header ────────────────────────────────────────────── */
    @media (max-width: 540px) {
      header .shell {
        flex-wrap: wrap;
        height: auto;
        padding-block: 12px;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell">
      <a href="/" class="wordmark">
        <span class="lamp-dot lamp-dot--breathing" aria-hidden="true"></span>
        pilo
      </a>
      <nav aria-label="Main navigation">
        {{if .User}}
        <a href="/dashboard" class="nav-link{{if eq .ActiveNav "projects"}} nav-link--active{{end}}">projects</a>
        <a href="/settings" class="nav-link{{if eq .ActiveNav "settings"}} nav-link--active{{end}}">settings</a>
        <a href="/projects/new" class="btn-primary">new project</a>
        <form method="post" action="/logout" style="display:inline; margin-left: 8px;">
          <button type="submit" class="btn-text btn-text--muted" style="cursor:pointer; font-size:13.5px;" title="{{.User.Email}}">sign out</button>
        </form>
        {{else}}
        <a href="/login" class="nav-link{{if eq .ActiveNav "login"}} nav-link--active{{end}}">sign in</a>
        {{if not .SignupsDisabled}}
        <a href="/signup" class="btn-primary">sign up</a>
        {{end}}
        {{end}}
      </nav>
    </div>
  </header>

  {{block "main" .}}{{end}}

  <footer>
    <div class="shell">
      {{block "footer" .}}
      <p>pilo</p>
      {{end}}
    </div>
  </footer>
</body>
</html>
{{end}}
