{{define "base"}}
<!doctype html>
<html lang="en" class="h-full bg-zinc-950 text-zinc-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Pilo · Tiny PaaS{{end}}</title>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(24, 24, 27, 0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(63, 63, 70, 0.5); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(113, 113, 122, 0.7); }
    .glass-panel {
      background: rgba(24, 24, 27, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .htmx-request.htmx-indicator { display: inline-flex !important; }
    .htmx-request .htmx-indicator-target { display: none !important; }
  </style>
</head>
<body class="min-h-full bg-zinc-950 font-sans text-zinc-200 flex flex-col relative overflow-x-hidden" x-data="{ toast: '', copyToClipboard(text) { navigator.clipboard.writeText(text); this.toast = 'Copied to clipboard!'; setTimeout(() => this.toast = '', 2500); } }">
  <!-- Radial background accent gradient -->
  <div class="pointer-events-none fixed inset-0 z-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-950/20 via-zinc-950 to-zinc-950"></div>
  <div class="pointer-events-none fixed -top-40 -left-40 w-96 h-96 bg-emerald-500/5 rounded-full blur-3xl"></div>
  <div class="pointer-events-none fixed top-1/3 -right-40 w-96 h-96 bg-indigo-500/5 rounded-full blur-3xl"></div>

  <!-- Glassmorphic Header Navigation -->
  <header class="sticky top-0 z-40 border-b border-zinc-800/80 glass-panel">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <a href="/" class="flex items-center gap-2.5 group">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-lg shadow-emerald-500/20 group-hover:scale-105 transition-transform">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
          </div>
          <div class="flex flex-col">
            <span class="font-bold text-lg text-white tracking-tight group-hover:text-emerald-400 transition-colors">Pilo</span>
            <span class="text-[10px] text-zinc-500 font-mono tracking-wider -mt-1 uppercase">PaaS Engine</span>
          </div>
        </a>
        
        <div class="hidden sm:flex items-center gap-2 px-2.5 py-1 rounded-full bg-zinc-900/80 border border-zinc-800/80 text-xs text-zinc-400">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span class="font-medium text-zinc-300">System Ready</span>
        </div>
      </div>

      <nav class="flex items-center gap-3 text-sm font-medium">
        <a href="/" class="px-3.5 py-2 rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-800/50 transition-colors">Projects</a>
        <a href="/settings" class="px-3.5 py-2 rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-800/50 transition-colors">Settings</a>
        <a href="/projects/new" class="inline-flex items-center gap-1.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold px-4 py-2 rounded-lg shadow-md shadow-emerald-950/50 hover:shadow-emerald-500/20 hover:scale-[1.02] active:scale-[0.98] transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
          </svg>
          <span>New Project</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="relative z-10 flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {{block "content" .}}{{end}}
  </main>

  <!-- Toast Notification Overlay -->
  <div x-show="toast" 
       x-transition:enter="transition ease-out duration-300 transform"
       x-transition:enter-start="opacity-0 translate-y-4 scale-95"
       x-transition:enter-end="opacity-100 translate-y-0 scale-100"
       x-transition:leave="transition ease-in duration-200 transform"
       x-transition:leave-start="opacity-100 translate-y-0 scale-100"
       x-transition:leave-end="opacity-0 translate-y-4 scale-95"
       x-cloak
       class="fixed bottom-6 right-6 z-50 flex items-center gap-2.5 bg-zinc-900/95 border border-emerald-500/40 text-zinc-100 px-4 py-3 rounded-xl shadow-xl shadow-black/50 backdrop-blur-md">
    <div class="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>
    <span class="text-sm font-medium" x-text="toast"></span>
  </div>

  <footer class="relative z-10 border-t border-zinc-800/60 py-6 text-center text-xs text-zinc-600">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p>© Pilo — Lightweight Self-Hosted PaaS for Raspberry Pi &amp; Edge</p>
      <div class="flex items-center gap-4 text-zinc-500">
        <a href="https://github.com" target="_blank" class="hover:text-zinc-400 transition-colors">GitHub</a>
        <span>·</span>
        <a href="/health" target="_blank" class="hover:text-zinc-400 transition-colors">Health Check</a>
      </div>
    </div>
  </footer>
</body>
</html>
{{end}}
