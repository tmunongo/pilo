version: '3.8'

services:
  pilo:
    image: ghcr.io/tmunongo/pilo:latest
    container_name: pilo
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PILO_PORT=8080
      - PILO_DATA_DIR=/data
      - PILO_BASE_URL=http://localhost:8080
      # - PILO_DISABLE_SIGNUPS=true
      # - PILO_ADMIN_EMAIL=you@example.com
      # - PILO_ADMIN_PASSWORD=change-me-to-a-secure-password
    volumes:
      - pilo-data:/data

volumes:
  pilo-data:
    driver: local
